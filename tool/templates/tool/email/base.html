<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <style>
        @media only screen and (max-width: 640px) {
            .container {
                width: 100% !important;
            }
            .stack {
                display: block !important;
                width: 100% !important;
            }
        }
    </style>
</head>
<body style="margin:0; padding:0; background-color:#0d1224;">
    <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">
        {{ preheader }}
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0d1224;">
        <tr>
            <td align="center" style="padding:24px 16px 40px;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" class="container" style="width:600px; max-width:600px;">
                    <tr>
                        <td style="padding:4px 8px 16px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="font-family:'Inter','Helvetica Neue',Arial,sans-serif; color:#e2e8f0;">
                                        {% if brand_url %}
                                        <a href="{{ brand_url }}" style="text-decoration:none; color:#e2e8f0;">
                                        {% endif %}
                                            <span style="display:inline-block; width:34px; height:34px; line-height:34px; text-align:center; font-weight:800; border-radius:10px; background:linear-gradient(140deg,#38bdf8,#ec4899); color:#0b1224; letter-spacing:-0.04em;">MV</span>
                                            <span style="display:inline-block; vertical-align:middle; margin-left:10px; font-weight:700; letter-spacing:0.01em;">MachinaViva</span>
                                        {% if brand_url %}
                                        </a>
                                        {% endif %}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color:#0f172a; border-radius:16px; border:1px solid rgba(255,255,255,0.08); padding:28px; font-family:'Inter','Helvetica Neue',Arial,sans-serif;">
                            {% if eyebrow %}
                            <div style="font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:#94a3b8; margin-bottom:12px;">
                                {{ eyebrow }}
                            </div>
                            {% endif %}
                            <h1 style="margin:0 0 14px; font-size:24px; line-height:1.3; color:#f8fafc;">
                                {{ title }}
                            </h1>
                            <div style="font-size:15px; line-height:1.7; color:#cbd5e1;">
                                {% block content %}{% endblock %}
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 8px 0; text-align:center; font-family:'Inter','Helvetica Neue',Arial,sans-serif; color:#94a3b8; font-size:12px;">
                            (c) {{ year }} MachinaViva
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
